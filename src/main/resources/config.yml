# RoyalSacks main configuration.
# Sacks are defined one per file in sacks/. Menu layout and text are in menus.yml, chat text in messages.yml.
# Reload everything except storage with /sacks reload.

storage:
  # SQLITE (no setup) or MYSQL (fill in the block below). Several servers may share one MySQL database.
  # Storage settings apply on restart.
  type: SQLITE
  sqlite-file: "sacks.db"
  mysql:
    host: localhost
    port: 3306
    database: royalsacks
    username: root
    password: ""
    properties: "useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    pool-size: 10

sacks:
  # If this placeholder resolves (RoyalSkyblock + PlaceholderAPI), each profile has its own sacks;
  # otherwise each player has one set. Blank it to force one set per player.
  # In per-profile mode a player with no active profile has no sacks.
  scope-placeholder: "%royalskyblock_profile_id%"

pickup:
  # Whether picked-up items go into sacks for a player who never used /sacks pickup.
  enabled-by-default: true
  # How often pickups are written to the database, in seconds. A crash loses at most this much.
  flush-seconds: 3
  # Show "+N items added to your sacks" in the action bar after each write.
  action-bar: true
  # How often the "sack is full" message may repeat for the same sack, in seconds.
  full-warning-seconds: 60
